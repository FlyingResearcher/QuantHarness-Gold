<script id="post-data" type="application/json">
{
  "title": "黄金交易分析，一个开源多 Agent LLM 项目能帮你做什么",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 28px;\">上周有个做黄金期货的朋友找我吐槽，说每天早上打开交易软件，面对 COMEX 和 SHFE 的 K 线图，堆在屏幕上的 RSI、MACD、布林带……看得头晕，但真正的交易决策还是凭感觉。</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 28px;\">我特别懂这种感觉。技术分析指标越来越多，图表越画越花，但<span style=\"background:#fff3cd;color:#856404;padding:2px 6px;border-radius:3px;\"><strong>没有一个东西帮你把这堆指标、形态、趋势合成一个可以落地的判断</strong></span>。</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 44px;\">最近我一直在折腾一个开源项目，刚好就是解决这个问题的。它叫 <strong style=\"color:#1a1a1a;\">QuantHarness Gold</strong>——基于 Y-Research-SBU 那篇备受关注的 QuantHarness 论文架构，做了一个黄金市场的专属实现。</p>\n\n<!-- 01 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">先说说它从哪来</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 20px;\">2025 年 9 月，Fei Xiong、Xiang Zhang 等五位研究者发表了一篇 arXiv 论文——<strong style=\"color:#1a1a1a;\">QuantHarness: Price-Driven Multi-Agent LLMs for High-Frequency Trading</strong>。</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 20px;\">这篇论文提出了一个很有意思的想法：<span style=\"color:#0a84ff;font-weight:bold;\">不是让一个大模型从零分析市场，而是让多个\"小专家\"Agent 各干各的，然后汇总成交易决策</span>。他们用 LangGraph 把指标计算、图表形态识别、趋势分析拆成三个独立 Agent，再交给一个 Decision Agent 综合。这个架构在多品类上都跑出了不错的效果。</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 28px;\">QuantHarness Gold 就是站在这篇论文肩膀上的一个工程实现。原团队验证了\"多 Agent 协同做市场分析\"这条路走得通，那我就想，能不能把这套架构在单一品类上做深、做实用？选了黄金，因为它兼具商品、避险、货币三重属性，技术分析的密度和难度都够高。</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 44px;\">在这里特别感谢原 QuantHarness 研究团队——如果不是他们把这套架构跑通了、把论文公开了，就不会有这个项目。感谢 Fei Xiong、Xiang Zhang、Aosong Feng、Siqi Sun、Chenyu You 五位作者。</p>\n\n<!-- 02 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">它做了什么事</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 20px;\">一句话说透——让三个擅长不同事的 LLM Agent，像一个小团队一样协同工作，最终给你一个 LONG 或 SHORT 的方向判断。</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 20px;\">从公开数据源拉取黄金 K 线，自动在东方财富、同花顺、AKShare 之间 Failover。然后分三路并行分析，最后汇总成一份结构化的 JSON 决策。</p>\n\n<p style=\"text-align:center;margin:0 0 20px;\"><img src=\"assets/pipeline.svg\" alt=\"多 Agent 分析流水线\" style=\"max-width:100%;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08);\"/></p>\n<p style=\"text-align:center;font-size:13px;color:#999;margin:-6px 0 28px;\">图：三个专业 Agent 并行分析后由 Decision Agent 综合</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 12px;\"><strong style=\"color:#1a1a1a;\">Indicator Agent</strong> 负责技术指标——RSI、MACD、Stochastic、ROC、Williams %R。</p>\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 12px;\"><strong style=\"color:#1a1a1a;\">Pattern Agent</strong> 负责看图——先生成 K 线图，再用视觉 LLM 识别形态。</p>\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 28px;\"><strong style=\"color:#1a1a1a;\">Trend Agent</strong> 负责趋势——拟合支撑位和阻力位，判断当前在通道里还是正在突破。</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 44px;\">三份报告交给 Decision Agent 综合，输出包含<strong style=\"color:#0a84ff;\">方向、风险回报比、预测周期、具体理由</strong>的交易决策。</p>\n\n<!-- 03 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">相比原版，我加了什么</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 20px;\">原版 QuantHarness 是研究论文，这个项目是它的黄金落地版。做了几个方向的延伸：</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 12px;\">第一，<strong style=\"color:#1a1a1a;\">把数据源做成了多源自动 Failover</strong>。论文里用的数据是研究场景的，这里接了东方财富、同花顺、AKShare 三个公开源，哪个挂了自动换下一个，还做了 OHLC 完整性校验。COMEX 美盘和 SHFE 沪金主力合约都覆盖。</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 12px;\">第二，<strong style=\"color:#1a1a1a;\">加了双槽位 LLM 配置</strong>。原版假设一个模型干所有事，这里允许给指标分析配个便宜的文本模型，给形态识别配个带视觉能力的多模态模型，按实际需求组合成本和能力。</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 12px;\">第三，<strong style=\"color:#1a1a1a;\">完整的执行溯源</strong>。每一步是 LLM 算的还是本地程序算的，用了哪个模型，都记在 analysis_provenance 里。研究的时候最怕黑箱，这个设计就是为了让分析过程可追溯、可复现。</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 28px;\">同时给了 CLI 和 Flask Web 界面两种用法。终端党一条命令出 Markdown 报告，喜欢图形界面的打开浏览器就能配置模型、选合约、看结果。</p>\n\n<!-- 04 -->\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">接下来要做什么</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 20px;\">现在这个版本是研究起点，后面还有几块硬骨头想啃：</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 12px;\"><strong style=\"color:#1a1a1a;\">回测引擎</strong>。有了方向判断，但这个判断在历史上到底准不准？打算把每次 Decision Agent 输出的 JSON 决策存下来，跑历史回放，算胜率、盈亏比、最大回撤这些指标。论文里的实验结果要自己在黄金品类上复现一遍。</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 12px;\"><strong style=\"color:#1a1a1a;\">扩展到更多资产</strong>。现在只支持 COMEX 和 SHFE 黄金。后面想看看能不能把同样的多 Agent 架构跑在白银、原油、或者 A 股主要指数上——毕竟原版论文就是多品类的，黄金只是第一步。</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 12px;\"><strong style=\"color:#1a1a1a;\">更多 Agent 类型</strong>。现在只有指标、形态、趋势三个，原版论文里其实还探索了更多 Agent 组合。可能加一个宏观数据 Agent，把美元指数、实际利率、ETF 持仓这些外部因子拉进来做交叉验证。</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 28px;\">感兴趣的朋友可以点个 star，后面更新我会在 GitHub 上持续同步。</p>\n\n<!-- 收尾 -->\n<p style=\"text-align:center;font-size:22px;font-weight:bold;color:#1a1a1a;margin:50px 0 20px;\">最后说一句实在话</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 20px;\">QuantHarness Gold 不是圣杯。AI 不会替你承担风险，也不会保证赚钱。但它把分散的技术分析这件事做得更结构化、更可追溯了——这是我觉得最有价值的地方。</p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 20px;\"><span style=\"color:#0a84ff;font-weight:bold;\">真正有意思的不是\"AI 帮你分析 K 线\"，而是\"多个 AI Agent 像一个小团队一样协同分析\"——这件事在金融之外的很多场景里，都值得继续探索。</span></p>\n\n<p style=\"font-size:15px;color:#666;line-height:1.75;margin:0 0 44px;\">项目完全开源。如果你在研究黄金交易、做多 Agent 应用、或者就是对这个方向感兴趣，欢迎过来看看，提 Issue、发 PR 都欢迎。</p>\n\n<!-- CTA -->\n<p style=\"text-align:center;font-size:14px;color:#999;margin:50px 0 12px;\">————————————————</p>\n<p style=\"text-align:center;font-size:15px;color:#333;font-weight:bold;margin:0 0 12px;\">QuantHarness Gold</p>\n<p style=\"text-align:center;font-size:13px;color:#888;margin:0 0 24px;\">开源多 Agent LLM 黄金市场技术分析系统</p>\n<p style=\"text-align:center;font-size:13px;color:#999;margin:0 0 32px;\">基于 QuantHarness 论文架构 · 纯研究导向 · 不提供实盘交易执行</p>\n\n<p style=\"text-align:center;font-size:14px;color:#666;margin:0 0 8px;\">觉得有用的话</p>\n<p style=\"text-align:center;font-size:14px;color:#666;margin:0 0 24px;\">点个「点赞」「在看」「转发」给更多需要的朋友 ✦</p>\n\n<p style=\"text-align:center;font-size:13px;color:#aaa;margin:0;\">评论区聊聊，你觉得多 Agent 协同这条路，能走多远？</p>\n"
}

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
